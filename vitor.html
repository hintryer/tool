<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vditor 编辑器</title>
    <!-- Vditor CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor/dist/index.css">
    <style>
        /* 清除浏览器默认边距，消除顶部白边 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #vditor {
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="vditor"></div>
    <!-- Vditor JS -->
    <script src="https://cdn.jsdelivr.net/npm/vditor/dist/index.min.js"></script>
    <script>
        const vditor = new Vditor('vditor', {
            height: '100%',
            mode: 'wysiwyg', // wysiwyg所见即所得 / ir即时渲染 / sv分屏
            placeholder: '请输入 Markdown 内容...',
        });
    </script>
</body>
</html>
